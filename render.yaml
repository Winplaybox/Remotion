# Render.com blueprint — Telegram webhook server for the video bot (docs/TELEGRAM_BOT.md).
services:
  - type: web
    name: telegram-video-bot
    runtime: node
    plan: free
    rootDir: apps/telegram-bot
    buildCommand: echo "no dependencies"
    startCommand: node server.mjs
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GH_DISPATCH_TOKEN
        sync: false
      - key: TG_ADMIN_ID
        sync: false
      - key: TG_ALLOWLIST
        sync: false
      - key: TG_WEBHOOK_SECRET
        generateValue: true
      - key: GITHUB_REPO
        value: Winplaybox/Remotion

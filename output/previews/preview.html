<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF2Shorts Studio — Preview Player</title>
  <style>
    body {
      background: #030712;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #00F5FF, #7928CA);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94A3B8;
      margin-bottom: 30px;
    }
    .video-container {
      width: 360px;
      height: 640px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 245, 255, 0.2), 0 0 0 2px rgba(0, 245, 255, 0.4);
      background: #000;
      margin-bottom: 40px;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .stills-grid {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 1200px;
    }
    .still-card {
      background: #0F172A;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      overflow: hidden;
      width: 280px;
      text-align: center;
    }
    .still-card img {
      width: 100%;
      height: 497px;
      object-fit: cover;
      display: block;
    }
    .still-card .label {
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #00F5FF;
    }
  </style>
</head>
<body>
  <h1>PDF2Shorts Studio — Phase 1 Visual Proof</h1>
  <p>9:16 Vertical Shorts Format (1080×1920 @ 30 FPS) • Animated Typography • 3D Attention Core • PiP AI Avatar Host</p>

  <div class="video-container">
    <video controls autoplay loop muted playsinline>
      <source src="phase1-cinematic-proof.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
  </div>

  <h2>Key Style Frames</h2>
  <div class="stills-grid">
    <div class="still-card">
      <img src="frame-hook.png" alt="Hook Scene Frame" />
      <div class="label">Scene 1: Hook & PiP AI Avatar</div>
    </div>
    <div class="still-card">
      <img src="frame-hero-3d.png" alt="3D Hero Attention Core Frame" />
      <div class="label">Scene 2: 3D Spatial Attention Core</div>
    </div>
    <div class="still-card">
      <img src="frame-outro.png" alt="Outro & Findings Frame" />
      <div class="label">Scene 3: 2.5D Data Findings & CTA</div>
    </div>
  </div>
</body>
</html>

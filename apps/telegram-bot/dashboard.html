<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Bot Admin</title>
<style>
:root{--bg:#0d0f13;--panel:#151820;--panel2:#1b1f29;--line:#262b37;--ink:#e8ebf1;--mute:#8d96a7;--acc:#ffc94a;--acc-ink:#1a1400;--ok:#34c47c;--bad:#f0605d;--info:#6aa8ff;--warn:#f2a33a;--r:12px;
  --shadow:0 10px 30px rgba(0,0,0,.35)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f4f5f8;--panel:#fff;--panel2:#f7f8fb;--line:#e3e6ed;--ink:#151922;--mute:#5d6676;--acc:#c98a00;--acc-ink:#fff;--shadow:0 10px 30px rgba(20,25,35,.12)}}
:root[data-theme="light"]{--bg:#f4f5f8;--panel:#fff;--panel2:#f7f8fb;--line:#e3e6ed;--ink:#151922;--mute:#5d6676;--acc:#c98a00;--acc-ink:#fff;--shadow:0 10px 30px rgba(20,25,35,.12)}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--info)}
button,select,input{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--acc);display:inline-block}
.brand small{color:var(--mute);font-weight:500}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0}
.tab{border:0;background:transparent;padding:7px 12px;border-radius:9px;color:var(--mute);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--panel2);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.tab .n{margin-left:6px;font-size:11px;padding:0 6px;border-radius:99px;background:var(--acc);color:var(--acc-ink);font-weight:700}
.tools{display:flex;gap:6px;align-items:center}
.btn{text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--panel);padding:6px 11px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.acc{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.btn.sm{padding:3px 8px;font-size:12px;border-radius:7px}
.btn.ghost{background:transparent}
main{max-width:1280px;margin:0 auto;padding:18px 16px 80px}
h2{font-size:15px;margin:0 0 10px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi b{display:block;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--mute);font-size:12.5px}
.kpi.warn b{color:var(--warn)}.kpi.bad b{color:var(--bad)}.kpi.ok b{color:var(--ok)}
.kpi{cursor:default}.kpi[data-go]{cursor:pointer}.kpi[data-go]:hover{border-color:var(--mute)}
.two{grid-template-columns:2fr 1fr}
.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:900px){.two,.three{grid-template-columns:1fr}}
.chart svg{width:100%;height:190px;display:block}
.legend{display:flex;gap:14px;color:var(--mute);font-size:12px;margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.mini{list-style:none;margin:0;padding:0}
.mini li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.mini li:first-child{border-top:0}
.mini li.click{cursor:pointer}.mini li.click:hover b{color:var(--acc)}
.mute{color:var(--mute)}.small{font-size:12px}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:4px;min-width:60px}
.bar>i{display:block;height:100%;background:var(--acc)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 11px;cursor:pointer;font-size:12.5px}
.chip b{font-weight:600;margin-left:4px;color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] b{color:var(--bg)}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:0 10px;min-width:220px}
.search input{border:0;background:transparent;outline:0;padding:7px 0;width:100%}
select{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 8px}
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--mute);font-weight:600;background:var(--panel2);position:sticky;top:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:0}
td.cb,th.cb{width:34px;padding-right:0}
.code{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:520px}
.st{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid var(--line);white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.g{color:var(--ok)}.st.r{color:var(--bad)}.st.y{color:var(--warn)}.st.b{color:var(--info)}.st.m{color:var(--mute)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.pager .pages{display:flex;gap:4px;flex-wrap:wrap}
.pager .btn[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{padding:40px 12px;text-align:center;color:var(--mute)}
.bulk{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;width:min(760px,calc(100vw - 32px));z-index:10;display:none;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--acc);border-radius:var(--r);padding:10px 14px;box-shadow:var(--shadow)}
.bulk.on{display:flex}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--panel2),var(--line),var(--panel2));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);background:var(--bg);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .22s ease;z-index:21;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer.on{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dh h3{margin:0;font-size:16px}
.db{overflow:auto;padding:16px;display:grid;gap:14px;align-content:start}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--mute)}.kv dd{margin:0;word-break:break-word}
pre{white-space:pre-wrap;word-break:break-word;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px;margin:0;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;max-height:260px;overflow:auto}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 12px 12px}
.tl li::before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--mute)}
.tl li.r::before{border-color:var(--bad)}.tl li.g::before{border-color:var(--ok)}.tl li.b::before{border-color:var(--info)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.media{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.media img{width:150px;border-radius:9px;border:1px solid var(--line);background:var(--panel2)}
.alert{border:1px solid color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 8%,var(--panel));border-radius:9px;padding:10px;font-size:13px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.2s;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:30;font-weight:600;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-size:12px;cursor:pointer;user-select:none}
.live input{accent-color:var(--acc)}
/* phones: rows become cards */
@media (max-width:720px){
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tbody tr{border-bottom:1px solid var(--line);padding:8px 4px}
  td{border:0;padding:4px 10px}
  td.cb{position:absolute;right:6px;width:auto}
  tbody tr{position:relative}
  td[data-l]::before{content:attr(data-l);display:block;color:var(--mute);font-size:11px}
  .search{min-width:0;flex:1}
  .tabs{order:3;flex-basis:100%}
  .brand small,.live span{display:none}
  .tools .btn{padding:5px 8px}
  .brand{flex:1}
  .chips{flex-basis:100%}
  .chip{white-space:nowrap}
  .kv{grid-template-columns:100px 1fr}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><i></i>Video Bot Admin <small>· __ADMIN__</small></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div class="tools">
    <label class="live" title="Har 15 second mein refresh"><input type="checkbox" id="live"><span>Live</span></label>
    <button class="btn ghost" id="refresh" title="Refresh (R)">↻</button>
    <button class="btn ghost" id="theme" title="Theme: system / dark / light">Theme</button>
    <a class="btn ghost" href="/admin/logout">Logout</a>
  </div>
</div></header>
<main id="view"></main>
<div class="bulk" id="bulk"><span id="bulk-n"></span><div class="actions" id="bulk-a"></div></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"><div class="dh"><h3 id="d-title"></h3><button class="btn ghost" id="d-close" aria-label="Close">✕</button></div><div class="db" id="d-body"></div></aside>
<div class="toast" id="toast"></div>
<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmt = new Intl.DateTimeFormat("en-IN", { timeZone: "Asia/Kolkata", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const when = (t) => t ? new Date(t) : null;
function ago(t) {
  const d = when(t); if (!d) return "";
  const s = (Date.now() - d) / 1000;
  if (s < 60) return "abhi";
  if (s < 3600) return `${Math.floor(s / 60)} min pehle`;
  if (s < 86400) return `${Math.floor(s / 3600)} ghante pehle`;
  if (s < 7 * 86400) return `${Math.floor(s / 86400)} din pehle`;
  return fmt.format(d);
}
const time = (t) => t ? `<span title="${esc(fmt.format(when(t)))}">${esc(ago(t))}</span>` : "—";
const dur = (a, b) => { if (!a || !b) return "—"; const m = (when(b) - when(a)) / 60000; return m < 1 ? `${Math.round(m * 60)} s` : m < 120 ? `${m.toFixed(1)} min` : `${(m / 60).toFixed(1)} h`; };
const TONE = { COMPLETED: "g", PUBLISHED: "g", APPROVED: "g", admin: "g", FAILED: "r", REJECTED: "r", CANCELLED: "m", MERGED: "m", PENDING_REVIEW: "y", PENDING_APPROVAL: "y", PARTIAL: "y", QUEUED: "b", SCHEDULED: "b", creator: "b", user: "m" };
const st = (s) => `<span class="st ${TONE[s] || "b"}">${esc(String(s).replace(/_/g, " "))}</span>`;
const FINAL = new Set(["COMPLETED", "FAILED", "CANCELLED"]);

const TABS = [
  { id: "overview", label: "Overview" },
  { id: "ideas", label: "Ideas", badge: "ideas_pending" },
  { id: "jobs", label: "Jobs", badge: "jobs_active" },
  { id: "publications", label: "Publishing", badge: "pubs_pending" },
  { id: "users", label: "Users" },
  { id: "social", label: "Social" }
];
const STATUSES = {
  ideas: ["PENDING_REVIEW", "APPROVED", "IN_PRODUCTION", "COMPLETED", "REJECTED", "MERGED"],
  jobs: ["QUEUED", "VALIDATING", "SCRIPT_GENERATION", "NARRATION", "VISUAL_GENERATION", "AUDIO_PROCESSING", "RENDERING", "UPLOADING", "COMPLETED", "FAILED", "CANCELLED"],
  publications: ["PENDING_APPROVAL", "SCHEDULED", "PUBLISHING", "PUBLISHED", "PARTIAL", "FAILED", "REJECTED", "CANCELLED"],
  users: ["admin", "creator", "user"]
};

// ---------- state in the URL hash: #jobs?status=FAILED&q=x&page=2&size=25 ----------
function readHash() {
  const [tab, qs] = location.hash.slice(1).split("?");
  const p = new URLSearchParams(qs || "");
  return { tab: TABS.some((t) => t.id === tab) ? tab : "overview", status: p.get("status") || "", q: p.get("q") || "", page: Math.max(1, Number(p.get("page")) || 1), size: Number(p.get("size")) || Number(localGet("size")) || 25 };
}
function setHash(next) {
  const s = { ...readHash(), ...next };
  const p = new URLSearchParams();
  if (s.status) p.set("status", s.status);
  if (s.q) p.set("q", s.q);
  if (s.page > 1) p.set("page", s.page);
  if (s.size !== 25) p.set("size", s.size);
  const h = `#${s.tab}${p.toString() ? "?" + p : ""}`;
  if (h !== location.hash) location.hash = h; else render();
}
function localGet(k) { try { return localStorage.getItem("vb:" + k); } catch { return null; } }
function localSet(k, v) { try { localStorage.setItem("vb:" + k, v); } catch { /* private mode */ } }

// ---------- api ----------
async function api(path) {
  const r = await fetch(path, { headers: { accept: "application/json" }, credentials: "same-origin" });
  if (r.status === 401) { location.href = "/admin"; throw new Error("login"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}
async function act(action, code, value) {
  const r = await fetch("/admin/api/action", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action, code, value }) });
  if (!r.ok) throw new Error(await r.text());
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2200); }

// ---------- header ----------
let overview = null;
function renderTabs(active) {
  $("#tabs").innerHTML = TABS.map((t) => {
    const n = t.badge && overview ? overview[t.badge] : 0;
    return `<button class="tab" role="tab" data-tab="${t.id}" aria-selected="${t.id === active}">${t.label}${n ? `<span class="n">${esc(n)}</span>` : ""}</button>`;
  }).join("");
}

// ---------- overview ----------
function chart(daily) {
  if (!daily?.length) return `<div class="empty">Abhi data nahi</div>`;
  const W = 700, H = 190, P = 24, bw = (W - P * 2) / daily.length;
  const max = Math.max(1, ...daily.map((d) => d.created));
  const y = (v) => H - P - (v / max) * (H - P * 2);
  const bars = daily.map((d, i) => {
    const x = P + i * bw + bw * 0.18, w = bw * 0.64;
    const other = Math.max(0, d.created - d.completed - d.failed);
    let top = H - P, out = "";
    for (const [v, c] of [[d.completed, "var(--ok)"], [d.failed, "var(--bad)"], [other, "var(--info)"]]) {
      if (!v) continue;
      const h = (v / max) * (H - P * 2); top -= h;
      out += `<rect x="${x}" y="${top}" width="${w}" height="${h}" rx="2" fill="${c}"><title>${esc(d.day)}: ${d.created} jobs · ${d.completed} done · ${d.failed} failed</title></rect>`;
    }
    const lbl = i % 2 === daily.length % 2 ? "" : `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--mute)">${esc(d.day.slice(8))}</text>`;
    return out + lbl;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Jobs per day">
    <line x1="${P}" x2="${W - P}" y1="${y(max)}" y2="${y(max)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${P}" y="${y(max) - 4}" font-size="10" fill="var(--mute)">${max}</text>
    <line x1="${P}" x2="${W - P}" y1="${H - P}" y2="${H - P}" stroke="var(--line)"/>${bars}</svg>
    <div class="legend"><span><i style="background:var(--ok)"></i>Bana</span><span><i style="background:var(--bad)"></i>Fail</span><span><i style="background:var(--info)"></i>Chal raha / cancel</span></div>`;
}
async function renderOverview() {
  const v = $("#view");
  v.innerHTML = `<div class="grid kpis">${Array(8).fill(`<div class="card kpi"><div class="skel" style="width:40%;height:22px"></div><div class="skel" style="width:70%;margin-top:8px"></div></div>`).join("")}</div>`;
  const [o, ideas, failed, pubs] = await Promise.all([
    api("/admin/api/overview"),
    api("/admin/api/list?entity=ideas&status=PENDING_REVIEW&size=10"),
    api("/admin/api/list?entity=jobs&status=FAILED&size=10"),
    api("/admin/api/list?entity=publications&status=PENDING_APPROVAL&size=10")
  ]);
  overview = o; renderTabs("overview");
  const k = (n, l, cls = "", go = "") => `<div class="card kpi ${cls}" ${go ? `data-go="${go}" tabindex="0" role="link"` : ""}><b>${esc(n ?? 0)}</b><span>${l}</span></div>`;
  const total = (o.jobs_completed || 0) + (o.jobs_failed || 0);
  const rate = total ? Math.round((o.jobs_completed / total) * 100) : null;
  const mini = (rows, line, empty) => rows.length ? `<ul class="mini">${rows.map(line).join("")}</ul>` : `<div class="mute small">${empty}</div>`;
  v.innerHTML = `
  <div class="grid kpis">
    ${k(o.ideas_pending, "Ideas review ke liye", o.ideas_pending ? "warn" : "", "ideas?status=PENDING_REVIEW")}
    ${k(o.jobs_active, "Jobs chal rahi hain", "", "jobs")}
    ${k(o.jobs_completed, "Videos bane (total)", "ok", "jobs?status=COMPLETED")}
    ${k(o.jobs_failed, "Jobs fail", o.jobs_failed ? "bad" : "", "jobs?status=FAILED")}
    ${k(rate == null ? "—" : rate + "%", "Success rate")}
    ${k(o.jobs_24h, "Jobs (24 ghante)")}
    ${k(o.avg_minutes == null ? "—" : o.avg_minutes + " min", "Avg video time (14 din)")}
    ${k(o.pubs_pending, "Publish approval baaki", o.pubs_pending ? "warn" : "", "publications?status=PENDING_APPROVAL")}
    ${k(o.pubs_scheduled, "Publish scheduled", "", "publications?status=SCHEDULED")}
    ${k(o.pubs_published, "Published", "ok", "publications?status=PUBLISHED")}
    ${k(o.users, "Users", "", "users")}
    ${k(o.active_users_7d, "Active (7 din)")}
  </div>
  <div class="grid two" style="margin-top:12px">
    <div class="card chart"><h2>Pichhle 14 din</h2>${chart(o.daily)}</div>
    <div class="card"><h2>Video type</h2>${mini(Object.entries(o.by_kind || {}).sort((a, b) => b[1] - a[1]), ([kind, n]) => `<li><span>${esc(kind)}</span><b>${esc(n)}</b></li>`, "Abhi koi job nahi")}
      <h2 style="margin-top:16px">Fail hone ki wajah (14 din)</h2>${mini(o.top_errors || [], (e) => `<li><span class="small">${esc(e.error || "(blank)")}</span><b>${esc(e.n)}</b></li>`, "Koi failure nahi 🎉")}</div>
  </div>
  <div class="grid three" style="margin-top:12px">
    <div class="card"><h2>Ideas review karo <span class="mute small">(${esc(ideas.total)})</span></h2>${mini(ideas.rows, (i) => `<li class="click" data-open="idea:${esc(i.code)}"><span class="clip">${esc(i.title)}</span><b class="mute small">${esc(i.code)}</b></li>`, "Sab review ho gaye ✓")}</div>

const OPEN = { ideas: (r) => `idea:${r.code}`, jobs: (r) => `job:${r.code}`, publications: (r) => `pub:${r.code}`, users: (r) => `user:${r.tg_id}` };
let current = { rows: [] };
const selected = new Set();

async function renderList(s) {
  const v = $("#view");
  const statuses = STATUSES[s.tab];
  if (!$("#list") || v.dataset.view !== s.tab) {
    selected.clear();
    v.dataset.view = s.tab;
    v.innerHTML = `<div class="toolbar">
      <div class="chips" id="chips"></div>
      <label class="search"><span class="mute">⌕</span><input id="q" type="search" placeholder="Search ID, text, user, @username, TG id…" autocomplete="off"></label>
      <select id="size" aria-label="Rows per page">${[10, 25, 50, 100].map((n) => `<option value="${n}">${n} / page</option>`).join("")}</select>
    </div><div class="tablewrap" id="list"></div>`;
  }
  $("#q").value !== s.q && document.activeElement !== $("#q") && ($("#q").value = s.q);
  $("#size").value = String(s.size);
  const list = $("#list");
  if (!list.dataset.loaded) list.innerHTML = `<div style="padding:14px">${Array(6).fill(`<div class="skel" style="margin:10px 0"></div>`).join("")}</div>`;
  const qs = new URLSearchParams({ entity: s.tab, page: s.page, size: s.size });
  if (s.status) qs.set("status", s.status);
  if (s.q) qs.set("q", s.q);
  const data = await api(`/admin/api/list?${qs}`);
  if (readHash().tab !== s.tab) return; // user moved on
  current = { ...data, tab: s.tab };
  list.dataset.loaded = "1";
  const all = Object.values(data.counts || {}).reduce((a, b) => a + b, 0);
  const extra = Object.keys(data.counts || {}).filter((k) => !statuses.includes(k));
  $("#chips").innerHTML = [`<button class="chip" data-status="" aria-pressed="${!s.status}">Sab<b>${all}</b></button>`,
    ...[...statuses, ...extra].filter((x) => data.counts?.[x] || x === s.status).map((x) => `<button class="chip" data-status="${esc(x)}" aria-pressed="${x === s.status}">${esc(x.replace(/_/g, " ").toLowerCase())}<b>${data.counts?.[x] ?? 0}</b></button>`)].join("");
  const cols = COLS[s.tab], bulk = BULK[s.tab];
  const from = data.total ? data.offset + 1 : 0, to = data.offset + data.rows.length;
  const pages = Math.max(1, Math.ceil(data.total / data.limit));
  const pageBtns = [];
  for (const p of [...new Set([1, s.page - 1, s.page, s.page + 1, pages])].filter((p) => p >= 1 && p <= pages).sort((a, b) => a - b)) {
    if (pageBtns.length && p - pageBtns[pageBtns.length - 1].p > 1) pageBtns.push({ gap: true, p });
    pageBtns.push({ p });
  }
  list.innerHTML = data.rows.length ? `<table><thead><tr>${bulk ? `<th class="cb"><input type="checkbox" id="all" aria-label="Select all"></th>` : ""}${cols.map(([h]) => `<th>${h}</th>`).join("")}</tr></thead>
    <tbody>${data.rows.map((r, i) => `<tr data-open="${esc(OPEN[s.tab](r))}" data-i="${i}">${bulk ? `<td class="cb"><input type="checkbox" data-sel="${i}" ${selected.has(r.code) ? "checked" : ""} aria-label="Select"></td>` : ""}${cols.map(([h, f]) => `<td data-l="${esc(h)}">${f(r)}</td>`).join("")}</tr>`).join("")}</tbody></table>
    <div class="pager"><span class="mute small">${from}–${to} of ${data.total}</span><div class="pages">
      <button class="btn sm" data-page="${s.page - 1}" ${s.page <= 1 ? "disabled" : ""}>‹ Prev</button>
      ${pageBtns.map((b) => b.gap ? `<span class="mute">…</span>` : `<button class="btn sm" data-page="${b.p}" aria-current="${b.p === s.page}">${b.p}</button>`).join("")}
      <button class="btn sm" data-page="${s.page + 1}" ${s.page >= pages ? "disabled" : ""}>Next ›</button></div></div>`
    : `<div class="empty">${s.q || s.status ? "Is filter mein kuch nahi mila." : "Abhi kuch nahi hai."}</div>`;
  renderBulk();
}
function renderBulk() {
  const bar = $("#bulk"), bulk = BULK[current.tab];
  if (!bulk || !selected.size) { bar.classList.remove("on"); return; }
  const rows = current.rows.filter((r) => selected.has(r.code));
  $("#bulk-n").textContent = `${selected.size} selected`;
  $("#bulk-a").innerHTML = bulk.map(([a, label, cls, ok]) => { const n = rows.filter(ok).length; return `<button class="btn ${cls}" data-bulk="${a}" ${n ? "" : "disabled"}>${label} (${n})</button>`; }).join("") + `<button class="btn ghost" data-bulk="clear">Clear</button>`;
  bar.classList.add("on");
}

function openDrawer(key) { drawerKey = key; $("#drawer").classList.add("on"); $("#drawer").setAttribute("aria-hidden", "false"); $("#scrim").classList.add("on"); loadDrawer(); }

const kv = (pairs) => `<dl class="kv">${pairs.filter(([, v]) => v !== undefined && v !== null && v !== "").map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;
async function loadDrawer() {
  const key = drawerKey; if (!key) return;

      if (j.status === "COMPLETED") {
        if (out.file_deleted) h += `<div class="mute small">Video ${esc("retention")} ke baad delete ho chuka hai.</div>`;
        else h += `<div class="media">${out.thumb ? `<img src="/admin/api/media/${esc(j.code)}/thumb" alt="Thumbnail" loading="lazy">` : ""}<div class="actions">${out.file ? `<a class="btn acc" href="/admin/api/media/${esc(j.code)}/video" target="_blank" rel="noopener">▶ Video dekho</a>` : ""}${(out.shorts || []).map((s, i) => s.file ? `<a class="btn" href="/admin/api/media/${esc(j.code)}/short-${i + 1}" target="_blank" rel="noopener">Short ${i + 1}</a>` : "").join("")}</div></div>`;
      }
      h += kv([["User", `${esc(j.user?.name || "")} ${j.user?.username ? `<span class="mute">@${esc(j.user.username)}</span>` : ""} <span class="mute">${esc(j.tg_id)}</span>`],
        ["Bana", time(j.created_at)], ["Update", time(j.updated_at)], ["Khatam", j.completed_at ? time(j.completed_at) : ""], ["Time laga", j.completed_at ? dur(j.created_at, j.completed_at) : ""],
        ["Retries", j.retry_count || ""], ["Narrator", esc(j.input?.narrator || out.narrator || "")], ["Language", esc(out.language || j.input?.language || "")], ["Aspect", esc(out.aspect || j.input?.aspect || "")], ["Idea", esc(j.input?.ideaCode || out.idea || "")]]);
      if (out.title || out.description) h += `<div class="card"><h2>${esc(out.title || "")}</h2>${out.description ? `<div class="small" style="white-space:pre-wrap">${esc(out.description)}</div>` : ""}${out.hashtags?.length ? `<div class="mute small" style="margin-top:6px">${esc(out.hashtags.join(" "))}</div>` : ""}${out.sources?.length ? `<div style="margin-top:8px" class="small">${out.sources.map((s) => /^https?:\/\//.test(s.url || s) ? `<div><a href="${esc(s.url || s)}" target="_blank" rel="noopener noreferrer">${esc(s.title || s.url || s)}</a></div>` : "").join("")}</div>` : ""}</div>`;
      const input = j.input?.text || j.input?.topic || "";
      if (input) h += `<div><h2>Input</h2><pre>${esc(input)}</pre></div>`;
      if (j.events?.length) h += `<div><h2>Timeline</h2><ul class="tl">${j.events.map((e) => `<li class="${TONE[e.status] || "b"}"><b class="small">${esc(e.status.replace(/_/g, " "))}</b> <span class="mute small">${esc(e.progress)}% · ${time(e.at)}</span>${e.message ? `<div class="small mute">${esc(e.message.slice(0, 400))}</div>` : ""}</li>`).join("")}</ul></div>`;
      if (j.publications?.length) h += `<div><h2>Publishing</h2>${j.publications.map((p) => `<div class="card small">${st(p.status)} <b>${esc(p.code)}</b> → ${esc(p.target || "—")} <span class="mute">${esc((p.platforms || []).join(" + "))}</span>${Object.entries(p.results || {}).map(([k, r]) => `<div>${r.ok ? "✓" : "✗"} ${esc(k)}${r.id && r.id !== "published" ? ` · ${esc(r.id)}` : ""}${r.error ? ` <span class="mute">${esc(r.error)}</span>` : ""}</div>`).join("")}</div>`).join("")}</div>`;
    } else if (kind === "idea") {
      const i = await api(`/admin/api/idea/${encodeURIComponent(code)}`);

      if (i.jobs?.length) h += `<div><h2>Is idea se videos</h2><ul class="mini">${i.jobs.map((j) => `<li class="click" data-open="job:${esc(j.code)}"><b>${esc(j.code)}</b>${st(j.status)}</li>`).join("")}</ul></div>`;

    } else if (kind === "pub") {

      if (!p) throw new Error("not found");
      h += `<div class="actions">${st(p.status)}</div>`;

      <div class="actions" style="margin-top:6px"><button class="btn sm" data-soc="check" data-ch="${c.id}" data-pf="meta">Test</button><a class="btn sm" href="/admin/connect/meta?channel=${c.id}">Reconnect</a><button class="btn sm bad" data-soc="disconnect" data-ch="${c.id}" data-pf="meta">Disconnect</button></div>`;
    if (a?.options?.pages?.length) return `<div class="small" style="margin-bottom:6px">Login: ${esc(a.options.user)} — <b>${esc(c.name)}</b> ka Page chuno:</div>
      <select data-pick-page="${c.id}" data-nonce="${esc(a.options.nonce)}"><option value="">— Page —</option>${a.options.pages.map((p) => `<option value="${esc(p.id)}">${esc(p.name)}${p.ig_username ? ` (@${esc(p.ig_username)})` : " (no Instagram)"}</option>`).join("")}</select>`;
    return d.apps.meta ? `<a class="btn acc" href="/admin/connect/meta?channel=${c.id}">Connect Instagram + Facebook</a>` : `<span class="mute small">App set nahi</span>`;
  };
  const pinCell = (c) => {
    const a = acc(c.id, "pinterest");
    if (!a?.has_token) return d.apps.pinterest ? `<a class="btn acc" href="/admin/connect/pinterest?channel=${c.id}">Connect Pinterest</a>` : `<span class="mute small">App set nahi</span>`;
    const boards = a.options?.boards ?? [];
    return `<div><b>@${esc(a.account_name)}</b> <span class="mute small">Pinterest</span></div>
      <div class="small">Board: ${a.board_id ? `<b>${esc(a.board_name)}</b>` : `<span class="st y">chuno</span>`}
        <select data-pick-board="${c.id}" style="margin-left:6px"><option value="">${a.board_id ? "badlo…" : "— board —"}</option>${boards.map((b) => `<option value="${esc(b.id)}">${esc(b.name)}</option>`).join("")}</select>
        <button class="btn sm" data-soc="create-board" data-ch="${c.id}">+ Naya board</button></div>
      <div class="mute small">Token ${a.expires_at ? `valid till ${esc(fmt.format(when(a.expires_at)))} (apne aap refresh)` : ""}</div>
      <div class="actions" style="margin-top:6px"><button class="btn sm" data-soc="check" data-ch="${c.id}" data-pf="pinterest">Test</button><a class="btn sm" href="/admin/connect/pinterest?channel=${c.id}">Reconnect</a><button class="btn sm bad" data-soc="disconnect" data-ch="${c.id}" data-pf="pinterest">Disconnect</button></div>`;
  };
  v.innerHTML = `${msg ? `<div class="card" style="margin-bottom:12px">${esc(msg)}</div>` : ""}
    <div class="card" style="margin-bottom:12px"><h2>Har channel ke apne social accounts</h2>
      <div class="small mute">Connect dabao → login karo → Allow. Token encrypted ho ke save hota hai; publish job wahi use karta hai.
      Order: YouTube → Instagram +5 min → Facebook teaser +10 → Pinterest pin +15. Har jagah YouTube link + subscribe.</div>
      ${d.shared ? "" : `<div class="alert small" style="margin-top:8px">Database connected nahi hai (memory mode) — connect kiye accounts GitHub jobs tak nahi pahunchenge.</div>`}
      ${appWarn("meta", "Meta (Instagram/Facebook)")}${appWarn("pinterest", "Pinterest")}
      <div class="small mute" style="margin-top:8px">Ek Facebook login se saare Pages aa jaate hain — jis Page ka naam channel jaisa hai wo apne aap jud jaata hai. Pinterest: har channel ka alag account, isliye Connect se pehle pinterest.com pe us channel ke account se login rakho.</div></div>
    <div class="tablewrap"><table><thead><tr><th>Channel</th><th>Instagram + Facebook</th><th>Pinterest</th></tr></thead><tbody>
    ${d.channels.map((c) => `<tr style="cursor:default"><td data-l="Channel"><b>${esc(c.name)}</b><div class="mute small">${esc(c.handle)}</div></td><td data-l="Instagram + Facebook">${metaCell(c)}</td><td data-l="Pinterest">${pinCell(c)}</td></tr>`).join("")}
    </tbody></table></div>`;
}

// ---------- render loop ----------
let busy = false;
async function render() {
  const s = readHash();
  renderTabs(s.tab);
  if (s.tab !== "overview") $("#view").dataset.view !== s.tab && ($("#view").innerHTML = "");
  try {
    if (s.tab === "overview") { $("#view").dataset.view = "overview"; await renderOverview(); }
    else if (s.tab === "social") { $("#bulk").classList.remove("on"); await renderSocial(); }
    else { $("#bulk").classList.remove("on"); await renderList(s); }
  } catch (e) { if (e.message !== "login") $("#view").innerHTML = `<div class="alert">Load nahi hua: ${esc(e.message)} <button class="btn sm" id="retry-load">Dobara</button></div>`; }
}
async function refresh(quiet) {
  if (busy) return; busy = true;
  try {
    if (!overview || readHash().tab !== "overview") overview = await api("/admin/api/overview").catch(() => overview);
    await render();
    if (drawerKey) await loadDrawer();
    if (!quiet) toast("Refreshed");
  } finally { busy = false; }
}

// ---------- events ----------
document.addEventListener("click", async (e) => {
  const t = e.target;
  const tab = t.closest("button[data-tab]"); if (tab) { setHash({ tab: tab.dataset.tab, status: "", q: "", page: 1 }); return; }
  const go = t.closest("[data-go]"); if (go) { location.hash = "#" + go.dataset.go; return; }
  const chip = t.closest("[data-status]"); if (chip) { setHash({ status: chip.dataset.status, page: 1 }); return; }
  const pg = t.closest("[data-page]"); if (pg && !pg.disabled) { setHash({ page: Number(pg.dataset.page) }); window.scrollTo({ top: 0 }); return; }
  if (t.closest("[data-close]")) { closeDrawer(); return; }
  const soc = t.closest("[data-soc]");
  if (soc) {
    if (soc.dataset.soc === "disconnect" && !confirm(`${soc.dataset.pf} disconnect karein?`)) return;
    soc.disabled = true;
    try { toast(await social(soc.dataset.soc, { channel: soc.dataset.ch, platform: soc.dataset.pf })); } catch (err) { toast("✗ " + err.message); }
    renderSocial(); return;
  }
  if (t.id === "retry-load") { render(); return; }
  if (t.matches("input[data-sel]")) { const r = current.rows[Number(t.dataset.sel)]; t.checked ? selected.add(r.code) : selected.delete(r.code); renderBulk(); e.stopPropagation(); return; }
  if (t.id === "all") { for (const [i, r] of current.rows.entries()) { t.checked ? selected.add(r.code) : selected.delete(r.code); const cb = $(`input[data-sel="${i}"]`); if (cb) cb.checked = t.checked; } renderBulk(); return; }
  if (t.closest("td.cb")) return;
  const a = t.closest("[data-act]");
  if (a) {
    e.preventDefault(); e.stopPropagation();
    if (["reject", "cancel", "unpublish", "disallow"].includes(a.dataset.act) && !confirm(`${a.dataset.act} ${a.dataset.code}?`)) return;
    a.disabled = true;
    try { await act(a.dataset.act, a.dataset.code); toast(`✓ ${a.dataset.act} ${a.dataset.code}`); } catch (err) { toast("✗ " + err.message); }
    await refresh(true); return;
  }
  const b = t.closest("[data-bulk]");
  if (b) {
    if (b.dataset.bulk === "clear") { selected.clear(); render(); return; }
    const rule = BULK[current.tab].find(([x]) => x === b.dataset.bulk);
    const codes = current.rows.filter((r) => selected.has(r.code) && rule[3](r)).map((r) => r.code);
    if (!codes.length || !confirm(`${rule[1]}: ${codes.length} items?`)) return;
    b.disabled = true;
    let ok = 0;
    for (const c of codes) { try { await act(rule[0], c); ok++; } catch { /* counted below */ } }
    toast(`✓ ${ok}/${codes.length} done`); selected.clear(); await refresh(true); return;
  }
  const open = t.closest("[data-open]");
  if (open && !t.closest("a[href]:not([data-open])")) { e.preventDefault(); openDrawer(open.dataset.open); }
});
document.addEventListener("change", async (e) => {
  if (e.target.id === "size") { localSet("size", e.target.value); setHash({ size: Number(e.target.value), page: 1 }); }
  if (e.target.matches("[data-prio]")) { try { await act("priority", e.target.dataset.prio, e.target.value); toast("✓ Priority " + e.target.value); } catch (err) { toast("✗ " + err.message); } refresh(true); }
  if (e.target.matches("[data-pick-page]") && e.target.value) { try { toast(await social("pick-page", { channel: e.target.dataset.pickPage, nonce: e.target.dataset.nonce, page_id: e.target.value })); } catch (err) { toast("✗ " + err.message); } renderSocial(); }
  if (e.target.matches("[data-pick-board]") && e.target.value) { try { toast(await social("pick-board", { channel: e.target.dataset.pickBoard, board_id: e.target.value })); } catch (err) { toast("✗ " + err.message); } renderSocial(); }
  if (e.target.id === "live") { localSet("live", e.target.checked ? "1" : ""); }
});
let qTimer;
document.addEventListener("input", (e) => { if (e.target.id === "q") { clearTimeout(qTimer); qTimer = setTimeout(() => setHash({ q: e.target.value.trim(), page: 1 }), 300); } });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && drawerKey) closeDrawer();
  if (e.target.matches("input,select,textarea")) return;
  if (e.key === "/") { const q = $("#q"); if (q) { e.preventDefault(); q.focus(); } }
  if (e.key === "r" && !e.metaKey && !e.ctrlKey) refresh();
});
$("#scrim").onclick = closeDrawer;
$("#d-close").onclick = closeDrawer;
$("#refresh").onclick = () => refresh();
$("#theme").onclick = () => { const cur = document.documentElement.dataset.theme; const next = cur === "dark" ? "light" : cur === "light" ? "" : "dark"; if (next) document.documentElement.dataset.theme = next; else delete document.documentElement.dataset.theme; localSet("theme", next); toast(next ? `Theme: ${next}` : "Theme: system"); };
const savedTheme = localGet("theme"); if (savedTheme) document.documentElement.dataset.theme = savedTheme;
$("#live").checked = localGet("live") === "1";
setInterval(() => { if ($("#live").checked && !document.hidden && !$("#q")?.matches(":focus")) refresh(true); }, 15000);
window.addEventListener("hashchange", render);
api("/admin/api/overview").then((o) => { overview = o; }).catch(() => {}).finally(render);
})();
</script>
</body>
</html>

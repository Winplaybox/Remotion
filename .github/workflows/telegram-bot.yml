name: Telegram Bot Jobs

# Triggered by the Telegram webhook server (apps/telegram-bot/server.mjs on Render) via repository_dispatch.
#   tg-video: topic/script -> Gemini beats -> Edge TTS -> Remotion NarratorVideo -> sent back to the chat
#   tg-style: real video (Telegram file) -> Remotion ToonVideo (cartoon/anime/comic/sketch/watercolor) -> sent back
#   tg-shorts: long video / link -> faster-whisper transcript -> Gemini highlights (sentence boundaries) -> ShortClip x N
#   tg-idea : idea appended to content/ideas/inbox.jsonl on branch bot-data, admin notified
# Secrets: TELEGRAM_BOT_TOKEN, GEMINI_API_KEY, SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY (job progress; optional), YOUTUBE_COOKIES_B64 (optional Netscape cookies for YouTube links blocked by bot checks). Variables: TG_ADMIN_ID, GEMINI_MODEL (optional).
on:
  repository_dispatch:
    types: [tg-video, tg-style, tg-shorts, tg-idea]

permissions:
  contents: write

jobs:
  video:
    if: github.event.action == 'tg-video' || github.event.action == 'tg-style'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji && python -m pip install --quiet edge-tts
      - run: npm ci
      - name: Make and send the video
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload.job || github.event.client_payload) }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TG_ADMIN_ID: ${{ vars.TG_ADMIN_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHON: python
        run: npx ts-node scripts/telegram/${{ github.event.action == 'tg-style' && 'make-toon.ts' || 'make-video.ts' }}

  shorts:
    if: github.event.action == 'tg-shorts'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: whisper-small-v1 }
      - uses: denoland/setup-deno@v2\n      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && python -m pip install --quiet faster-whisper yt-dlp
      - run: npm ci
      - name: Make and send the Shorts
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload.job || github.event.client_payload) }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'small' }}
          PYTHON: python
        run: npx ts-node scripts/telegram/make-shorts.ts

  idea:
    if: github.event.action == 'tg-idea'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: { group: bot-data, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: scripts/telegram }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Save idea
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload.job || github.event.client_payload) }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_ADMIN_ID: ${{ vars.TG_ADMIN_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/telegram/save-idea.mjs

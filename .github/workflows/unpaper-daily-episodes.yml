name: Unpaper Daily Episodes

# Cloud generator: keeps the next 2 days of Unpaper slots populated from official RSS feeds
# using GitHub Models (GITHUB_TOKEN, free in Actions) + PyMuPDF page rendering, then opens a PR.
on:
  schedule:
    - cron: "30 20 * * *" # 02:00 IST, ahead of Prepare Voice (02:45 IST)
  workflow_dispatch:
    inputs:
      days: { description: "Days ahead to buffer", required: false, default: "2" }
      max_create: { description: "Max episodes to generate per run", required: false, default: "2" }

permissions:
  contents: write
  pull-requests: write
  models: read

concurrency:
  group: unpaper-daily-episodes
  cancel-in-progress: false

jobs:
  generate:
    if: vars.LIVE_UNPAPER_SHORT == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      GH_MODELS_MODEL: ${{ vars.GH_MODELS_MODEL || 'openai/gpt-4o-mini' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --quiet pymupdf
      - run: npm ci
      - name: Generate missing Unpaper daily episodes
        run: node scripts/unpaper/generate-daily.mjs --days "${{ inputs.days || '2' }}" --max "${{ inputs.max_create || '2' }}"
      - name: Verify TypeScript & Unpaper tests
        if: ${{ success() }}
        run: |
          npx tsc --noEmit
          npm test -- tests/unpaper-daily.test.ts tests/unpaper-short.test.ts
      - name: Open PR if new episodes were generated
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No new episodes generated."
            exit 0
          fi
          BR="auto/unpaper-daily-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add content/unpaper/daily public/unpaper/daily
          git commit -m "feat(unpaper): auto-generate upcoming daily episodes"
          git push -u origin "$BR"
          gh pr create --base main --title "feat(unpaper): upcoming daily episodes ($(date -u +%Y-%m-%d))" --body "Automatically generated by \`unpaper-daily-episodes.yml\` from official RSS feeds with rendered document pages."

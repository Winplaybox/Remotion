name: Unpaper Daily Episodes

# Cloud generator + 2-day YouTube buffer:
# 1. Restores cached daily episodes/MP4s from GitHub Actions Cache (no git commits or PRs).
# 2. Populates missing slots for today + next 2 days using 5-Phase Viral Blueprint + PyMuPDF pages.
# 3. Renders full MP4s with Edge TTS audio and schedules them on YouTube for each slot (09:00 / 19:00 IST).
# 4. Saves the updated buffer back to GitHub Actions Cache so publish-channels.yml posts IG/FB at slot time.
on:
  schedule:
    - cron: "30 20 * * *" # 02:00 IST, ahead of Prepare Voice (02:45 IST)
  workflow_dispatch:
    inputs:
      days: { description: "Days ahead to buffer", required: false, default: "2" }
      max_create: { description: "Max episodes to generate per run", required: false, default: "6" }
      schedule_youtube: { description: "Render & schedule buffered slots on YouTube", type: boolean, default: true }

permissions:
  contents: read
  models: read

concurrency:
  group: unpaper-daily-episodes
  cancel-in-progress: false

jobs:
  generate:
    if: vars.LIVE_UNPAPER_SHORT == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      GH_MODELS_MODEL: ${{ vars.GH_MODELS_MODEL || 'openai/gpt-4o-mini' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      REPO_VARS: ${{ toJSON(vars) }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
      YT_TOKEN_UNPAPER_SHORT: ${{ secrets.YT_TOKEN_UNPAPER_SHORT }}
      EDGE_TTS_VOICE: ${{ vars.EDGE_TTS_VOICE }}
      GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Restore Unpaper daily cache
        uses: actions/cache/restore@v4
        with:
          path: |
            content/unpaper/daily
            public/unpaper/daily
            output/unpaper-short
          key: unpaper-daily-restore-miss
          restore-keys: |
            unpaper-daily-
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-core
          python -m pip install --quiet pymupdf edge-tts
      - run: npm ci
      - name: Generate missing Unpaper daily episodes (2-day buffer)
        run: node scripts/unpaper/generate-daily.mjs --days "${{ inputs.days || '2' }}" --max "${{ inputs.max_create || '6' }}"
      - name: Verify TypeScript & Unpaper tests
        run: |
          npx tsc --noEmit
          npm test -- tests/unpaper-daily.test.ts tests/unpaper-short.test.ts
      - name: Render & schedule 2-day YouTube buffer
        if: (vars.AUTO_PUBLISH == 'true' || github.event_name == 'workflow_dispatch') && inputs.schedule_youtube != false
        shell: bash
        run: |
          set -euo pipefail
          M=$(npx ts-node scripts/due.ts --channel unpaper-short --buffer-days "${{ inputs.days || '2' }}")
          echo "Buffer slots: $M"
          node -e '
            const { execFileSync } = require("node:child_process");
            const list = JSON.parse(process.argv[1]).include || [];
            for (const { date, slot } of list) {
              console.log(`=== Scheduling unpaper-short ${date} slot ${slot} on YouTube ===`);
              execFileSync("npx", ["ts-node", "scripts/post.ts", "--channel", "unpaper-short", "--date", date, "--slot", String(slot), "--auto-narrate", "--youtube", "--meta-pending"], { stdio: "inherit" });
            }
          ' "$M"
      - name: Save Unpaper daily cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            content/unpaper/daily
            public/unpaper/daily
            output/unpaper-short
          key: unpaper-daily-${{ github.run_id }}-${{ github.run_attempt }}

name: Weekly Performance Report

on:
  schedule:
    - cron: "0 10 * * 1"
      # Runs every Monday at 10:00 UTC / 15:30 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Generate Weekly Strategic Summary
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Consolidated Weekly Summary
        run: npx tsx automation/analytics-audit.ts

      - name: Upload Weekly Report
        uses: actions/upload-artifact@v4
        with:
          name: weekly-performance-report
          path: reports/
          retention-days: 30

name: CI & Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint, Typecheck & Schema Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint & TypeScript Check
        run: npm run lint

      - name: Verify Core Schemas
        run: npx tsx -e "import './schemas/index.ts'; console.log('Schemas validated successfully.');"

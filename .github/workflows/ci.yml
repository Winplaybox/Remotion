name: CI

on:
  push:
    branches: [main, "ep/**"]
  pull_request:
    branches: [main]

jobs:
  typecheck-lint-test:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

  remotion-render-test:
    name: Phase 1 Remotion Render (CI Artifact)
    runs-on: ubuntu-latest
    needs: typecheck-lint-test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for headless render
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y chromium-browser

      - name: Render Phase 1 test composition
        run: |
          npx remotion render \
            src/remotion/index.ts \
            PhaseOneTest \
            output/ci-phase1-test.mp4 \
            --browser-executable=$(which chromium-browser) \
            --gl=swiftshader

      - name: Render engine smoke frames
        run: |
          npx remotion render src/remotion/index.ts OrbitPuzzle output/ci-orbit-puzzle.mp4 --frames=0-2 --browser-executable=$(which chromium-browser) --gl=swiftshader
          npx remotion render src/remotion/index.ts TrafficPuzzle output/ci-traffic-puzzle.mp4 --frames=0-2 --browser-executable=$(which chromium-browser) --gl=swiftshader
          npx remotion render src/remotion/index.ts SanatanStory output/ci-sanatan-story.mp4 --frames=0-2 --browser-executable=$(which chromium-browser) --gl=swiftshader

      - name: Upload render artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.0.0
        with:
          name: portrait-engine-smoke-renders
          path: output/ci-*.mp4
          retention-days: 7

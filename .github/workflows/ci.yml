name: Video Engine CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:bot
  portrait-render-smoke:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx remotion render apps/studio/src/remotion/index.ts OrbitPuzzle output/orbit-smoke.mp4 --frames=0-2
      - run: npx remotion render apps/studio/src/remotion/index.ts TrafficPuzzle output/traffic-smoke.mp4 --frames=0-2
      - run: npx remotion render apps/studio/src/remotion/index.ts SanatanStory output/sanatan-smoke.mp4 --frames=0-2
  narration-smoke:
    # Proves Edge TTS works from Actions and lets you listen to EP01 (artifact "ebs-narration-ep01").
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && python -m pip install --quiet edge-tts
      - run: npm ci
      - run: npx ts-node scripts/post.ts --channel epicbharatsaga --n 1 --dry --auto-narrate --require-narration
        env: { PYTHON: python }
      - run: npx ts-node scripts/post.ts --channel chakra-puzzle --n 1 --dry --auto-narrate && npx ts-node scripts/post.ts --channel kaali-peeli-chase --n 1 --dry --auto-narrate
        env: { PYTHON: python }
      - run: test $(ls public/audio/chakra-puzzle/post-001/*.wav | wc -l) -ge 4 && test $(ls public/audio/kaali-peeli-chase/post-001/*.wav | wc -l) -ge 4
      - uses: actions/upload-artifact@v4
        with:
          name: narration-samples
          path: public/audio/
          retention-days: 7
  engine-qa:
    # Production approval evidence: rendered previews + audio check for every engine. Download "engine-qa" and look.
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - run: npx ts-node scripts/engine-qa.ts --all --days 1,7,15,30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-qa
          path: qa/
          retention-days: 14

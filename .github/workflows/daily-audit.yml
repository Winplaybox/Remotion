name: Daily Audit

on:
  schedule:
    - cron: "30 2 * * *"   # 08:00 IST
    - cron: "30 12 * * *"  # 18:00 IST
  workflow_dispatch:

jobs:
  audit:
    name: Daily Content Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run audit
        run: npm run audit:scheduled
        env:
          AUDIT_ENV: github-actions

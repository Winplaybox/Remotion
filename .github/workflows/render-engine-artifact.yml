name: Render Engine Artifact

on:
  workflow_dispatch:
    inputs:
      engine:
        description: Engine to render
        required: true
        type: choice
        options:
          - orbit
          - traffic
          - sanatan

permissions:
  contents: read

concurrency:
  group: render-engine-${{ github.ref }}-${{ inputs.engine }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        run: npm ci

      - name: Render selected engine
        shell: bash
        run: |
          mkdir -p output
          case "${{ inputs.engine }}" in
            orbit)
              npx remotion render apps/studio/src/remotion/index.ts OrbitPuzzle output/orbit-puzzle.mp4
              ;;
            traffic)
              npx remotion render apps/studio/src/remotion/index.ts TrafficPuzzle output/traffic-puzzle.mp4
              ;;
            sanatan)
              npx remotion render apps/studio/src/remotion/index.ts SanatanStory output/sanatan-story.mp4
              ;;
            *)
              echo "Unsupported engine" >&2
              exit 2
              ;;
          esac

      - name: Normalize MP4 pixel format
        shell: bash
        run: |
          case "${{ inputs.engine }}" in
            orbit) file="output/orbit-puzzle.mp4" ;;
            traffic) file="output/traffic-puzzle.mp4" ;;
            sanatan) file="output/sanatan-story.mp4" ;;
          esac
          temp="${file%.mp4}.normalized.mp4"
          ffmpeg -y -i "$file" -map 0:v:0 -map '0:a?' -c:v libx264 -pix_fmt yuv420p -crf 18 -preset medium -c:a aac -b:a 192k -movflags +faststart "$temp"
          mv "$temp" "$file"

      - name: Validate MP4 contract
        shell: bash
        run: |
          case "${{ inputs.engine }}" in
            orbit) file="output/orbit-puzzle.mp4" ;;
            traffic) file="output/traffic-puzzle.mp4" ;;
            sanatan) file="output/sanatan-story.mp4" ;;
          esac
          npm run quality:render -- "$file"

      - name: Upload downloadable MP4
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.engine }}-video-${{ github.run_number }}
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 14

name: Render Engine Artifact
on:
  workflow_dispatch:
    inputs:
      engine:
        description: Engine to render (or all three)
        required: true
        type: choice
        default: all
        options:
          - all
          - orbit-puzzle
          - traffic-puzzle
          - sanatan-story
permissions:
  contents: read
concurrency:
  group: render-engine-${{ github.ref }}-${{ inputs.engine }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(inputs.engine == 'all' && '["orbit-puzzle","traffic-puzzle","sanatan-story"]' || format('["{0}"]', inputs.engine)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fonts-noto-core fonts-indic
          ffmpeg -version
          ffprobe -version
      - name: Install dependencies
        run: npm ci
      - name: Validate source
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Validate engine content
        run: npm run validate:engine -- "${{ matrix.engine }}"
      - name: Render complete composition
        run: npm run render:engine -- "${{ matrix.engine }}"
      - name: Validate MP4 contract
        run: |
          case "${{ matrix.engine }}" in
            orbit-puzzle) file="output/orbit-puzzle.mp4" ;;
            traffic-puzzle) file="output/traffic-puzzle.mp4" ;;
            sanatan-story) file="output/sanatan-story.mp4" ;;
          esac
          npm run quality:render -- "$file"
      - name: Write render manifest
        run: npm run manifest:render -- "${{ matrix.engine }}"
      - name: Capture diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p output/diagnostics
          for file in output/*.mp4; do
            [ -f "$file" ] || continue
            name="$(basename "$file" .mp4)"
            ffprobe -v error -show_streams -show_format -of json "$file" > "output/diagnostics/${name}-ffprobe.json"
            ffmpeg -v error -i "$file" -vf "select='eq(n,0)+eq(n,150)+eq(n,450)+eq(n,750)'" -vsync 0 "output/diagnostics/${name}-frame-%02d.jpg"
          done
      - name: Upload render, manifest and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.engine }}-render-${{ github.run_number }}
          path: |
            output/*.mp4
            output/manifests/*
            output/diagnostics/*
          if-no-files-found: warn
          retention-days: 14

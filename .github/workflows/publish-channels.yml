name: Publish Channels

# Hourly: find posts whose slot is 30-90 min away, take the video Claude rendered (render-queue branch),
# schedule it on YouTube for the exact slot and post the Reel to Instagram + Facebook.
# If Claude has not rendered a post, it is rendered here as a fallback (disable with CI_RENDER_FALLBACK=false).
# Scheduled runs only fire from the default branch.
on:
  schedule:
    - cron: "2 * * * *"
  # Backup hourly tick from Supabase pg_cron (videobot.github_tick) — GitHub sometimes skips scheduled runs for hours.
  # Same behaviour as the schedule; the publishing ledger + concurrency group make a double trigger harmless.
  repository_dispatch:
    types: [publish-tick]
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel id (chakra-puzzle, kaali-peeli-chase, epicbharatsaga). Empty = whatever is due."
        required: false
        type: string
      n:
        description: "Explicit post number (with channel). Empty = due slots."
        required: false
        type: string
      date:
        description: "With channel + n: schedule for this date's slot (YYYY-MM-DD). Empty = publish ~15 min from now."
        required: false
        type: string
      slot:
        description: "Slot index for that date (0 = first slot)."
        required: false
        type: string
      youtube:
        description: "Upload to YouTube"
        type: boolean
        default: true
      meta:
        description: "Social fan-out after YouTube: Instagram +5 min, Facebook teaser +10, Pinterest pin +15"
        type: boolean
        default: true

permissions:
  contents: read

# No workflow-wide lock: a post job waits up to ~2 h for its social fan-out, and must not block the next hour's run.
# Each slot has its own lock instead (see the post job), so a double trigger never posts a slot twice.

jobs:
  plan:
    runs-on: ubuntu-latest
    if: vars.AUTO_PUBLISH == 'true' || github.event_name == 'workflow_dispatch'
    outputs:
      matrix: ${{ steps.due.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - run: npm ci
      - id: due
        shell: bash
        env:
          LIVE_EPICBHARATSAGA: ${{ vars.LIVE_EPICBHARATSAGA }}
          START_EPICBHARATSAGA: ${{ vars.START_EPICBHARATSAGA }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${{ inputs.channel }}" ] && [ -n "${{ inputs.n }}" ]; then
            echo "matrix={\"include\":[{\"channel\":\"${{ inputs.channel }}\",\"n\":\"${{ inputs.n }}\",\"date\":\"${{ inputs.date }}\",\"slot\":\"${{ inputs.slot || '0' }}\"}]}" >> "$GITHUB_OUTPUT"
          else
            m=$(npx ts-node scripts/due.ts ${{ inputs.channel && format('--channel {0}', inputs.channel) || '' }})
            echo "matrix=$m" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  post:
    needs: plan
    if: needs.plan.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    # Render/upload (~10 min) + waiting until YouTube is public (slot is 30-90 min after the run) + IG/FB/Pinterest at +5/+10/+15.
    timeout-minutes: 170
    concurrency:
      group: publish-slot-${{ matrix.channel }}-${{ matrix.date || 'manual' }}-${{ matrix.slot }}-${{ matrix.n || 'auto' }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
      YT_TOKEN_EPICBHARATSAGA_CLIENT: ${{ secrets.YT_TOKEN_EPICBHARATSAGA_CLIENT }}
      YT_TOKEN_CHAKRA_PUZZLE: ${{ secrets.YT_TOKEN_CHAKRA_PUZZLE }}
      YT_TOKEN_KAALI_PEELI_CHASE: ${{ secrets.YT_TOKEN_KAALI_PEELI_CHASE }}
      YT_TOKEN_EPICBHARATSAGA: ${{ secrets.YT_TOKEN_EPICBHARATSAGA }}
      META_CHAKRA_PAGE_ID: ${{ secrets.META_CHAKRA_PAGE_ID }}
      META_CHAKRA_IG_USER_ID: ${{ secrets.META_CHAKRA_IG_USER_ID }}
      META_CHAKRA_PAGE_TOKEN: ${{ secrets.META_CHAKRA_PAGE_TOKEN }}
      META_KPC_PAGE_ID: ${{ secrets.META_KPC_PAGE_ID }}
      META_KPC_IG_USER_ID: ${{ secrets.META_KPC_IG_USER_ID }}
      META_KPC_PAGE_TOKEN: ${{ secrets.META_KPC_PAGE_TOKEN }}
      META_EBS_PAGE_ID: ${{ secrets.META_EBS_PAGE_ID }}
      META_EBS_IG_USER_ID: ${{ secrets.META_EBS_IG_USER_ID }}
      META_EBS_PAGE_TOKEN: ${{ secrets.META_EBS_PAGE_TOKEN }}
      LIVE_EPICBHARATSAGA: ${{ vars.LIVE_EPICBHARATSAGA }}
      START_EPICBHARATSAGA: ${{ vars.START_EPICBHARATSAGA }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
      PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
      PINTEREST_CHAKRA_REFRESH_TOKEN: ${{ secrets.PINTEREST_CHAKRA_REFRESH_TOKEN }}
      PINTEREST_CHAKRA_BOARD_ID: ${{ secrets.PINTEREST_CHAKRA_BOARD_ID }}
      PINTEREST_KPC_REFRESH_TOKEN: ${{ secrets.PINTEREST_KPC_REFRESH_TOKEN }}
      PINTEREST_KPC_BOARD_ID: ${{ secrets.PINTEREST_KPC_BOARD_ID }}
      PINTEREST_EBS_REFRESH_TOKEN: ${{ secrets.PINTEREST_EBS_REFRESH_TOKEN }}
      PINTEREST_EBS_BOARD_ID: ${{ secrets.PINTEREST_EBS_BOARD_ID }}
      SOCIAL_GAP_MIN: ${{ vars.SOCIAL_GAP_MIN }}
      EDGE_TTS_VOICE: ${{ vars.EDGE_TTS_VOICE }}
      CI_RENDER_FALLBACK: ${{ vars.CI_RENDER_FALLBACK }}
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - run: npm ci
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Narration tools (Edge TTS + ffmpeg)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet edge-tts
      - name: Build, render and publish
        shell: bash
        run: |
          set -euo pipefail
          ARGS="--channel ${{ matrix.channel }}"
          if [ -n "${{ matrix.n || '' }}" ]; then ARGS="$ARGS --n ${{ matrix.n }}"; if [ -n "${{ matrix.date }}" ]; then ARGS="$ARGS --date ${{ matrix.date }} --slot ${{ matrix.slot }}"; fi; else ARGS="$ARGS --date ${{ matrix.date }} --slot ${{ matrix.slot }}"; fi
          ARGS="$ARGS --auto-narrate"
          if [ "${{ matrix.channel }}" = "epicbharatsaga" ] && [ "${{ vars.EBS_ALLOW_SILENT }}" != "true" ]; then ARGS="$ARGS --require-narration"; fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.youtube }}" = "true" ]; then ARGS="$ARGS --youtube"; fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.meta }}" = "true" ]; then ARGS="$ARGS --meta"; fi
          npx ts-node scripts/post.ts $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.channel }}-${{ matrix.date || 'manual' }}-${{ matrix.slot }}-${{ github.run_id }}
          path: output/${{ matrix.channel }}/
          retention-days: 7

  answers:
    # Answer comment on puzzle videos that just went public (pin it in YouTube Studio).
    runs-on: ubuntu-latest
    concurrency: { group: publish-answers, cancel-in-progress: false }
    if: vars.AUTO_PUBLISH == 'true' || github.event_name == 'workflow_dispatch'
    env:
      YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
      YT_TOKEN_CHAKRA_PUZZLE: ${{ secrets.YT_TOKEN_CHAKRA_PUZZLE }}
      YT_TOKEN_KAALI_PEELI_CHASE: ${{ secrets.YT_TOKEN_KAALI_PEELI_CHASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - run: npm ci
      - run: npx ts-node scripts/publish/answer-comments.ts --hours 3

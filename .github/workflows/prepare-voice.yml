name: Prepare Voice

# Makes the Hinglish voice (Edge TTS) for the next 3 days of posts and puts it on the render-queue branch.
# Claude then renders the videos with Remotion and pushes them to the same branch; publish-channels.yml uploads.
on:
  schedule:
    - cron: "15 21 * * *"   # 02:45 IST, before Claude's 04:41 render run
    - cron: "15 9 * * *"    # 14:45 IST, catches same-day changes
  push:
    branches: [main]
    paths: ["content/**", "channels/**", "engines/**"]
  workflow_dispatch:
    inputs:
      days: { description: "Days ahead", required: false, default: "3" }
      include_paused: { description: "Also channels not live yet (preview)", type: boolean, default: false }

permissions:
  contents: write

concurrency:
  group: render-queue
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LIVE_EPICBHARATSAGA: ${{ vars.LIVE_EPICBHARATSAGA }}
      START_EPICBHARATSAGA: ${{ vars.START_EPICBHARATSAGA }}
      LIVE_DIMAAG_LOCK: ${{ vars.LIVE_DIMAAG_LOCK }}
      START_DIMAAG_LOCK: ${{ vars.START_DIMAAG_LOCK }}
      EDGE_TTS_VOICE: ${{ vars.EDGE_TTS_VOICE }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
      PYTHON: python
      QUEUE_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: tts-kokoro-v1
      - name: Narration engines (Kokoro, Gemini via API, Edge TTS)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install --quiet edge-tts
          # Kokoro is optional: if it does not install, narrate.py falls back to Gemini, then Edge.
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu \
            && python -m pip install --quiet "kokoro>=0.9.4" soundfile \
            || echo "::warning::Kokoro not installed — Gemini / Edge will narrate"
      - run: npm ci
      - name: Voice for upcoming posts -> render-queue
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/queue-sync.sh pull
          npx ts-node scripts/queue.ts prune --queue queue
          npx ts-node scripts/queue.ts voice --days "${{ inputs.days || '3' }}" --queue queue ${{ inputs.include_paused && '--include-paused' || '' }}
          scripts/queue-sync.sh push "voice $(date -u +%FT%TZ)"

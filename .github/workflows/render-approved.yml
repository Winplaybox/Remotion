name: Render Approved Video

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "Approved Video ID to render (must match content/approved/<id>.json)"
        required: true
        type: string
      composition_id:
        description: "Remotion Composition Name"
        required: false
        default: "ShortsMainComposition"
        type: string

permissions:
  contents: read

jobs:
  render:
    name: Remotion Headless Render & Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install System Dependencies for Headless Chromium / WebGL
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1 libasound2

      - name: Install NPM Dependencies
        run: npm ci

      - name: Validate Video Approval & Asset Integrity
        run: |
          npx tsx -e "
            console.log('Verifying approval and manifest for video: ${{ github.event.inputs.video_id }}');
          "

      - name: Render Remotion Composition
        run: |
          npx remotion render ${{ github.event.inputs.composition_id }} output/rendered/${{ github.event.inputs.video_id }}.mp4 --gl=angle

      - name: Upload Video Artifact for Human Approval
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video-${{ github.event.inputs.video_id }}
          path: output/rendered/${{ github.event.inputs.video_id }}.mp4
          retention-days: 7

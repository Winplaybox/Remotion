name: Render Approved Video

on:
  workflow_dispatch:
    inputs:
      videoId:
        description: "Approved VideoContent ID (format: vc_XXXXXXXX)"
        required: true
        type: string

jobs:
  validate-and-render:
    name: Validate ID then Render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate videoId format
        run: |
          if ! echo "${{ inputs.videoId }}" | grep -qE '^vc_[a-z0-9]{8}$'; then
            echo "ERROR: videoId must match vc_[a-z0-9]{8}"
            exit 1
          fi

      - name: Install Chrome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y chromium-browser

      - name: Render approved video
        run: |
          npx ts-node automation/render-approved.ts \
            --videoId="${{ inputs.videoId }}" \
            --browser=$(which chromium-browser)
        env:
          VIDEO_ID: ${{ inputs.videoId }}

      - name: Upload rendered MP4
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: rendered-${{ inputs.videoId }}
          path: output/rendered/${{ inputs.videoId }}.mp4
          retention-days: 30

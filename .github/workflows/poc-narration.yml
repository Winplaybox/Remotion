# POC only (branch poc/cinematic-neelkanth): synthesize the 10 s Neelkanth demo narration + word timings with Edge TTS.
# Produces an artifact; nothing is committed or published.
name: POC narration
on:
  push:
    branches: [poc/cinematic-neelkanth]
    paths: [engines/story-diorama/src/cinematic/neelkanth-lines.ts, .github/workflows/poc-narration.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -U edge-tts && sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Synthesize
        run: |
          mkdir -p out
          npx --yes tsx -e "import('./engines/story-diorama/src/cinematic/neelkanth-lines.ts').then(m => require('fs').writeFileSync('out/lines.json', JSON.stringify(m.NEELKANTH_LINES ?? m.default.NEELKANTH_LINES)))"
          python - <<'PY'
          import asyncio, json, subprocess
          import edge_tts
          cfg = json.load(open("out/lines.json"))
          timings = {}
          async def one(l):
              c = edge_tts.Communicate(l["hi"], cfg["voice"], rate=cfg["rate"], boundary="WordBoundary")
              words = []
              with open(f"out/{l['id']}.mp3", "wb") as f:
                  async for ch in c.stream():
                      if ch["type"] == "audio": f.write(ch["data"])
                      elif ch["type"] == "WordBoundary": words.append({"t": ch["offset"] / 1e7, "d": ch["duration"] / 1e7, "w": ch["text"]})
              subprocess.run(["ffmpeg", "-loglevel", "error", "-y", "-i", f"out/{l['id']}.mp3", "-ar", "48000", "-ac", "1", f"out/{l['id']}.wav"], check=True)
              dur = float(subprocess.check_output(["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "csv=p=0", f"out/{l['id']}.wav"]).decode().strip())
              timings[l["id"]] = {"duration": dur, "words": words}
          async def main():
              for l in cfg["lines"]:
                  for attempt in range(5):
                      try:
                          await one(l); break
                      except edge_tts.exceptions.NoAudioReceived:
                          print("retry", l["id"], attempt); await asyncio.sleep(3)
                  else:
                      raise SystemExit(f"no audio for {l['id']}")
          asyncio.run(main())
          json.dump(timings, open("out/timings.json", "w"), ensure_ascii=False, indent=1)
          print(json.dumps({k: v["duration"] for k, v in timings.items()}))
          PY
      - name: Commit voice to the POC branch only
        if: github.ref == 'refs/heads/poc/cinematic-neelkanth'
        run: |
          mkdir -p public/audio/poc-neelkanth && cp out/*.wav out/timings.json public/audio/poc-neelkanth/
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add public/audio/poc-neelkanth && git commit -m "poc: narration voice (Edge TTS) [skip ci]" && git push || echo nothing to commit
      - uses: actions/upload-artifact@v4
        with: { name: poc-narration, path: out/*.wav, retention-days: 7 }
      - uses: actions/upload-artifact@v4
        with: { name: poc-timings, path: out/timings.json, retention-days: 7 }

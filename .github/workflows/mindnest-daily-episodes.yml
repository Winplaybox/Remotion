name: MindNest V2 Episodes

# Generates the next MindNest V2 episode (5-Phase Viral Blueprint script + Storybook Classic plates + art.ts)
# and opens a PR for review before Prepare Voice (02:45 IST) runs.
on:
  schedule:
    - cron: "45 20 * * *" # 02:15 IST, ahead of Prepare Voice (02:45 IST)
  workflow_dispatch:
    inputs:
      count: { description: "Episodes to prepare", required: false, default: "1" }

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mindnest-v2-episodes
  cancel-in-progress: false

jobs:
  generate:
    if: vars.LIVE_MINDNEST_HI == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --quiet pillow
      - run: npm ci
      - name: Generate next MindNest V2 episode + art
        run: node scripts/mindnest/generate-v2-episode.mjs --count "${{ inputs.count || '1' }}"
      - name: Verify TypeScript & MindNest tests
        run: |
          npx tsc --noEmit
          npm test -- tests/story-visual-v2.test.ts tests/revived-channels.test.ts
      - name: Open PR if new episode was generated
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes generated."
            exit 0
          fi
          BR="auto/mindnest-v2-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add content/mindnest/fables.ts engines/story-visual-v2/src/episode/art.ts public/mindnest-v2/storybook-classic
          git commit -m "feat(mindnest): auto-generate next V2 episode + Storybook Classic art"
          git push -u origin "$BR"
          gh pr create --base main --title "feat(mindnest): next MindNest V2 episode ($(date -u +%Y-%m-%d))" --body "Automatically generated by \`mindnest-daily-episodes.yml\` with 5-Phase Viral Blueprint script + Storybook Classic V2 art."
